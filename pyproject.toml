[project]
name = "paws_on_stream_web"
version = "0.1.0"
description = ""
authors = [
  { name = "Daniel Bacher", email = "daniel.bacher@kit.edu" }
]
requires-python = ">=3.12"
dependencies = [
  "django (>=6.0.5,<7.0.0)",
  "psycopg2-binary (>=2.9.12,<3.0.0)",
  "djangorestframework (>=3.17.1,<4.0.0)",
  "python-decouple (>=3.8,<4.0)",
  "dj-database-url (>=3.1.2,<4.0.0)",
  "djangorestframework-stubs (>=3.17.0,<4.0.0)",
  "django-extensions (>=4.1,<5.0)",
  "django-tables2 (>=3.0.0,<4.0.0)",
  "pillow (>=11.3.0,<12.0.0)",
  "jq (>=1.12.0,<2.0.0)",
  "gunicorn (>=23.0.0,<24.0.0)",
  "authlib (>=1.6,<2.0)",
  "requests (>=2.32,<3.0)",
  "redis (>=6.4,<7.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
  "factory-boy (>=3.3.3,<4.0.0)",
  "ruff (>=0.15.0,<0.16.0)",
  "coverage (>=7.14.1,<8.0.0)",
  "django-debug-toolbar (>=7.0.0,<8.0.0)"
]
