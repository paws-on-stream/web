name: Django Tests
on: [ push, pull_request ]

jobs:
  django-tests:
    runs-on: ubuntu-latest
    container: "python:3.14"
    env:
      DEBUG: "False"
      SECRET_KEY: ci-only-not-used-outside-github-actions
      DATABASE_URL: postgres://dev_user:dev_pass@postgres:5432/dev_db
      REDIS_URL: redis://redis:6379/0
      API_AUTH_TOKEN: ci-api-token
      ALLOWED_HOSTS: testserver
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: dev_user
          POSTGRES_PASSWORD: dev_pass
          POSTGRES_DB: dev_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Install pipx
        run: python3 -m pip install pipx && pipx ensurepath
      - uses: abatilo/actions-poetry@v3
        with:
          poetry-version: main
      - name: Install dependencies
        run: /github/home/.local/bin/poetry install --with dev
      - name: Run django migrations
        run: /github/home/.local/bin/poetry run paws_on_stream_web/manage.py migrate --no-input
      - name: Run django tests
        run: >-
          /github/home/.local/bin/poetry run coverage run
          --source=paws_on_stream_web
          paws_on_stream_web/manage.py test core participants streaming dashboard
      - name: Enforce coverage
        run: /github/home/.local/bin/poetry run coverage report --fail-under=80
