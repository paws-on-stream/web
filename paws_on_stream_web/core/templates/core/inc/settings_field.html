<div class="{% if wide %}col-12{% else %}col-md-6{% endif %}">
  {% if field.field.widget.input_type == "checkbox" %}
    <div class="form-check border rounded p-3 ps-5 h-100">
      {{ field }}
      <label class="form-check-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
    </div>
  {% else %}
    <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% endif %}
  {% if field.errors %}<div class="invalid-feedback d-block">{{ field.errors.0 }}</div>{% endif %}
</div>
