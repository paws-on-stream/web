{% extends "base.html" %}

{% block title %}Display löschen — Paws on Stream{% endblock %}

{% block content %}
  <div class="card">
    <div class="card-body text-center py-5">
      <h1 class="h4 mb-3">Display löschen</h1>
      <p class="text-muted mb-4">Soll <strong>„{{ object.hostname }}“</strong> ({{ object.device_id }}) wirklich dauerhaft gelöscht werden?</p>
      <form method="post">
        {% csrf_token %}
        <a href="{% url 'core:device_detail' object.pk %}" class="btn btn-outline-secondary me-2">Abbrechen</a>
        <button type="submit" class="btn btn-danger">Display löschen</button>
      </form>
    </div>
  </div>
{% endblock %}
