{% extends "base.html" %}

{% block title %}Delete Device — Paws on Stream{% endblock %}

{% block content %}
  <div class="card">
    <div class="card-body text-center py-5">
      <h4 class="mb-3">Delete Device</h4>
      <p class="text-muted mb-4">Are you sure you want to delete <strong>"{{ object.hostname }}"</strong> ({{ object.device_id }})?</p>
      <form method="post">
        {% csrf_token %}
        <a href="{% url 'core:device_detail' object.pk %}" class="btn btn-outline-secondary me-2">Cancel</a>
        <button type="submit" class="btn btn-danger">Delete</button>
      </form>
    </div>
  </div>
{% endblock %}
