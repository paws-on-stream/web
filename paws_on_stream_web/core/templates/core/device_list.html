{% extends "base.html" %}
{% load django_tables2 %}

{% block title %}Displays — Paws on Stream{% endblock %}

{% block content %}
  <div class="row mb-3 align-items-center">
    <div class="col">
      <h1 class="mb-0">Displays</h1>
      <small class="text-muted">Raspberry-Pi-Displays verwalten</small>
    </div>
    <div class="col-auto">
      <a href="{% url 'core:device_list' %}" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-clockwise"></i> Neu laden
      </a>
    </div>
  </div>

  <div class="card">
    <div class="card-body p-0">
      <form method="post">
        {% csrf_token %}
        <div class="bulk-action-bar">
          <label for="device-bulk-action">Mehrfachaktion</label>
          <select id="device-bulk-action" name="action" class="form-select form-select-sm">
            <option value="">— Aktion auswählen —</option>
            <option value="activate">Ausgewählte aktivieren</option>
            <option value="deactivate">Ausgewählte deaktivieren</option>
            <option value="delete">Ausgewählte löschen</option>
          </select>
          <button type="submit" class="btn btn-sm btn-primary" id="bulk-action-submit">Anwenden</button>
        </div>
        {% render_table table %}
      </form>
    </div>
  </div>
{% endblock %}
