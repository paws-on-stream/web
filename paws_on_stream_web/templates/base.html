{% load static %}
<!DOCTYPE html>
<html lang="de" data-bs-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <title>{% block title %}Paws on Stream{% endblock %}</title>
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body style="height: 100%">
<div class="dropdown position-fixed bottom-0 end-0 mb-3 me-3 bd-mode-toggle">
  <button class="btn btn-bd-primary py-2 dropdown-toggle d-flex align-items-center"
          id="bd-theme"
          type="button"
          data-bs-toggle="dropdown"
          aria-expanded="false">

    <i class="bi bi-circle-half theme-icon-active"></i>

    <span class="visually-hidden" id="bd-theme-text">Toggle theme</span>
  </button>

  <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="bd-theme-text">

    <li>
      <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="light">
        <i class="bi bi-sun opacity-50 me-2"></i>
        Light
        <i class="bi bi-check ms-auto d-none"></i>
      </button>
    </li>

    <li>
      <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="dark">
        <i class="bi bi-moon-stars-fill opacity-50 me-2"></i>
        Dark
        <i class="bi bi-check ms-auto d-none"></i>
      </button>
    </li>

    <li>
      <button type="button" class="dropdown-item d-flex align-items-center active" data-bs-theme-value="auto">
        <i class="bi bi-circle-half opacity-50 me-2"></i>
        Auto
        <i class="bi bi-check ms-auto"></i>
      </button>
    </li>

  </ul>
</div>
<header class="navbar sticky-top bg-dark flex-md-nowrap p-0 shadow" data-bs-theme="dark">
  <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3 fs-6 text-white" href="#">Paws on Stream</a>
  <ul class="navbar-nav flex-row d-md-none">
    <li class="nav-item text-nowrap">
      <button class="nav-link px-3 text-white" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu"
              aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle navigation">
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>
    </li>
  </ul>
</header>
<div class="container-fluid">
  <div class="row">
    <div class="sidebar border border-right col-md-3 col-lg-2 p-0 bg-body-tertiary">
      <div class="offcanvas-md offcanvas-end bg-body-tertiary" tabindex="-1" id="sidebarMenu"
           aria-labelledby="sidebarMenuLabel">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="sidebarMenuLabel">Paws on Stream</h5>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu"
                  aria-label="Close"></button>
        </div>
        <div class="offcanvas-body d-md-flex flex-column p-0 pt-lg-3 overflow-y-auto">
          <ul class="nav flex-column">
            <li class="nav-item">
              <a class="nav-link d-flex align-items-center gap-2 active" aria-current="page"
                 href="{% url 'dashboard:dashboard' %}">
                <i class="bi bi-columns-gap" aria-hidden="true"></i>

                Dashboard
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link d-flex align-items-center gap-2" href="{% url 'streaming:message_list' %}">
                <i class="bi bi-chat-right-text" aria-hidden="true"></i>

                Messages
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link d-flex align-items-center gap-2" href="{% url 'participants:participant_list' %}">
                <i class="bi bi-people" aria-hidden="true"></i>

                Participants
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link d-flex align-items-center gap-2" href="{% url 'streaming:event_list' %}">
                <i class="bi bi-calendar3" aria-hidden="true"></i>

                Events
              </a>
            </li>
            <hr class="my-3">
            <ul class="nav flex-column mb-auto">
              <li class="nav-item">
                <a class="nav-link d-flex align-items-center gap-2" href="#">
                  <i class="bi bi-gear" aria-hidden="true"></i>

                  Settings
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link d-flex align-items-center gap-2" href="#">
                  <i class="bi bi-box-arrow-right" aria-hidden="true"></i>

                  Sign out
                </a>
              </li>
            </ul>
        </div>
      </div>
    </div>
    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
      <div
        class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        {% block header %}{% endblock %}
      </div>
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
