{% extends "base.html" %}
{% load django_tables2 %}

{% block title %}Participants — Paws on Stream{% endblock %}

{% block content %}
  <div class="row mb-3 align-items-center">
    <div class="col">
      <h1 class="mb-0">Participants</h1>
      <small class="text-muted">Manage event participants</small>
    </div>
    <div class="col-auto">
      <a href="{% url 'participants:participant_list' %}" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-clockwise"></i> Reload
      </a>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-body">
      <form method="get" class="row g-2 align-items-end">
        <div class="col-md-4">
          <label for="q" class="form-label small text-muted mb-1">Search</label>
          <input
            id="q"
            name="q"
            type="text"
            class="form-control form-control-sm"
            placeholder="Name, Telegram ID, Reg ID"
            value="{{ filters.q }}"
          >
        </div>
        <div class="col-md-2">
          <label for="checked_in" class="form-label small text-muted mb-1">Checked in</label>
          <select id="checked_in" name="checked_in" class="form-select form-select-sm">
            <option value="all" {% if filters.checked_in == "all" %}selected{% endif %}>All</option>
            <option value="yes" {% if filters.checked_in == "yes" %}selected{% endif %}>Yes</option>
            <option value="no" {% if filters.checked_in == "no" %}selected{% endif %}>No</option>
          </select>
        </div>
        <div class="col-md-2">
          <label for="banned" class="form-label small text-muted mb-1">Banned</label>
          <select id="banned" name="banned" class="form-select form-select-sm">
            <option value="all" {% if filters.banned == "all" %}selected{% endif %}>All</option>
            <option value="yes" {% if filters.banned == "yes" %}selected{% endif %}>Yes</option>
            <option value="no" {% if filters.banned == "no" %}selected{% endif %}>No</option>
          </select>
        </div>
        <div class="col-md-2">
          <label for="muted" class="form-label small text-muted mb-1">Muted</label>
          <select id="muted" name="muted" class="form-select form-select-sm">
            <option value="all" {% if filters.muted == "all" %}selected{% endif %}>All</option>
            <option value="yes" {% if filters.muted == "yes" %}selected{% endif %}>Yes</option>
            <option value="no" {% if filters.muted == "no" %}selected{% endif %}>No</option>
          </select>
        </div>
        <div class="col-md-2 d-flex gap-2">
          <button type="submit" class="btn btn-sm btn-primary w-100">Filter</button>
          <a href="{% url 'participants:participant_list' %}" class="btn btn-sm btn-outline-secondary">Clear</a>
        </div>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-body p-0">
      <form method="post">
        {% csrf_token %}
        <div class="px-3 py-2 d-flex gap-2 align-items-center border-bottom bg-body-tertiary">
          <span class="text-muted small">Bulk Actions:</span>
          <select name="action" class="form-select form-select-sm" style="min-width: 160px;">
            <option value="">— Choose action —</option>
            <option value="ban">🚫 Ban Selected</option>
            <option value="unban">✅ Unban Selected</option>
            <option value="delete">🗑️ Delete Selected</option>
          </select>
          <button type="submit" class="btn btn-sm btn-primary">Apply</button>
        </div>
        {% render_table table %}
      </form>
    </div>
  </div>
{% endblock %}
