{% extends "base.html" %}

{% block title %}Teilnehmer löschen — Paws on Stream{% endblock %}

{% block content %}
  <div class="card">
    <div class="card-body text-center py-5">
      <h1 class="h4 mb-3">Teilnehmer löschen</h1>
      <p class="text-muted mb-4">Soll <strong>„{{ object.display_name }}“</strong> (Telegram-ID {{ object.telegram_id }}) wirklich dauerhaft gelöscht werden?</p>
      <form method="post">
        {% csrf_token %}
        <a href="{% url 'participants:participant_detail' object.pk %}" class="btn btn-outline-secondary me-2">Abbrechen</a>
        <button type="submit" class="btn btn-danger">Teilnehmer löschen</button>
      </form>
    </div>
  </div>
{% endblock %}
