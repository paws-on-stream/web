{% extends "base.html" %}
{% load django_tables2 %}

{% block title %}Events — Paws on Stream{% endblock %}

{% block content %}
  <div class="row mb-3 align-items-center">
    <div class="col">
      <h1 class="mb-0">Events</h1>
      <small class="text-muted">Convention-Events und Displayverhalten verwalten</small>
    </div>
    <div class="col-auto d-flex gap-2">
      <a href="{% url 'streaming:event_create' %}" class="btn btn-sm btn-primary">
        <i class="bi bi-plus-lg"></i> Event anlegen
      </a>
      <a href="{% url 'streaming:event_list' %}" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-clockwise"></i> Neu laden
      </a>
    </div>
  </div>

  <div class="card">
    <div class="card-body p-0">
      <form method="post">
        {% csrf_token %}
        <div class="bulk-action-bar">
          <label for="event-bulk-action">Mehrfachaktion</label>
          <select id="event-bulk-action" name="action" class="form-select form-select-sm">
            <option value="">— Aktion auswählen —</option>
            <option value="activate">Ausgewählte aktivieren</option>
            <option value="deactivate">Ausgewählte deaktivieren</option>
            <option value="delete">Ausgewählte löschen</option>
          </select>
          <button type="submit" class="btn btn-sm btn-primary">Anwenden</button>
        </div>
        {% render_table table %}
      </form>
    </div>
  </div>

{% endblock %}
