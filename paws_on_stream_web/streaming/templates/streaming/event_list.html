{% extends "base.html" %}
{% load django_tables2 %}

{% block title %}Events — Paws on Stream{% endblock %}

{% block content %}
  <div class="row mb-3 align-items-center">
    <div class="col">
      <h1 class="mb-0">Events</h1>
      <small class="text-muted">Manage active convention events</small>
    </div>
    <div class="col-auto d-flex gap-2">
      <a href="{% url 'streaming:event_create' %}" class="btn btn-sm btn-primary">
        <i class="bi bi-plus-lg"></i> New Event
      </a>
      <a href="{% url 'streaming:event_list' %}" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-clockwise"></i> Reload
      </a>
    </div>
  </div>

  <div class="card">
    <div class="card-body p-0">
      <form method="post">
        {% csrf_token %}
        <div class="px-3 py-2 d-flex gap-2 align-items-center border-bottom bg-body-tertiary">
          <span class="text-muted small">Bulk Actions:</span>
          <select name="action" class="form-select form-select-sm" style="min-width: 160px;">
            <option value="">— Choose action —</option>
            <option value="activate">Activate Selected</option>
            <option value="deactivate">Deactivate Selected</option>
            <option value="delete">Delete Selected</option>
          </select>
          <button type="submit" class="btn btn-sm btn-primary">Apply</button>
        </div>
        {% render_table table %}
      </form>
    </div>
  </div>

{% endblock %}
