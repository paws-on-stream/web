{% extends "base.html" %}

{% block title %}Delete Event — Paws on Stream{% endblock %}

{% block content %}
  <div class="card">
    <div class="card-body text-center py-5">
      <h4 class="mb-3">Delete Event</h4>
      <p class="text-muted mb-4">Are you sure you want to delete <strong>"{{ object.name }}"</strong>?</p>
      <form method="post">
        {% csrf_token %}
        <a href="{% url 'streaming:event_detail' object.pk %}" class="btn btn-outline-secondary me-2">Cancel</a>
        <button type="submit" class="btn btn-danger">Delete</button>
      </form>
    </div>
  </div>
{% endblock %}
